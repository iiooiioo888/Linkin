name: close-pr-67-superseded
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/close-pr-67-superseded.yml"
jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: 67 });
            core.info(`PR #67 state=${pr.state} draft=${pr.draft}`);
            if (pr.state === "open") {
              await github.rest.issues.createComment({
                owner, repo, issue_number: 67,
                body: "Superseded by #68 (merged). Closing — #68 already includes the `execution_strategy` chat/stream fix plus company SSE reflect alignment and simple max iterations."
              });
              await github.rest.pulls.update({ owner, repo, pull_number: 67, state: "closed" });
              core.info("Closed PR #67 as superseded by #68");
            } else {
              core.info("PR #67 already not open; nothing to do");
            }
      - name: Remove this one-shot workflow
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete workflow file and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/close-pr-67-superseded.yml
          git add -A
          if git diff --cached --quiet; then echo "already gone"; exit 0; fi
          git commit -m "chore: remove one-shot close-pr-67 workflow"
          git push
