# 靈境·Linkin Docker Compose
# 服務：frontend / backend / opc_service / redis / chroma
#
# 啟動：docker compose up -d
# 建置：docker compose build --no-cache
# 日誌：docker compose logs -f
# 開發熱重載：見 docker-compose.dev.yml（前端宿主埠 3001）

services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: evoloop-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # 容器内使用服务名访问 Redis/Chroma
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      # 对话存檔寫入持久卷（避免鏡像重建後丟失）
      - EVOL_ARCHIVE_DIR=/app/data/archives
      # 運行時 LLM 配置持久化目錄
      - EVOL_CONFIG_DIR=/app/data
      # Docker Compose 项目名（供公司编排器识别）
      - DOCKER_COMPOSE_PROJECT=evoloop
      # 監控中心即時標籤經 opc_service REST，禁止直連 UA
      - OPC_SERVICE_URL=http://opc_service:8001
      # LLM 模型池定時爬取（OpenRouter / 通用端點 /models）
      - EVOL_LLM_OPS_ENABLED=true
      - EVOL_LLM_OPS_INTERVAL_SEC=300
      # 宿主機 MineMCP（Windows Docker）：http://host.docker.internal:3000
      # - EVOL_MC_MCP_ENABLED=true
      # - EVOL_MC_MCP_URL=http://host.docker.internal:3000
      # - EVOL_MC_MCP_TOKEN=
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      # 日誌持久化
      - backend_logs:/app/logs
      # 挂载 Docker socket 供公司编排器管理容器
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - evoloop_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    # 生产版前端（nginx）：默认启动
    # 开发模式通过 docker-compose.dev.yml 覆盖禁用
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: evoloop-frontend
    ports:
      # 與本機 Vite 預設對齊；容器內 nginx 仍聽 80
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # 日誌持久化
      - frontend_logs:/var/log/nginx
    networks:
      - evoloop_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  opc_service:
    build:
      context: .
      dockerfile: ./opc_service/Dockerfile
    container_name: evoloop-opc
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      # 默认启用模拟 OPC 服务器（开发测试用）
      - OPC_SIM_ENABLED=true
      - OPC_SIM_PORT=4840
    volumes:
      - opc_audit_data:/app/opc_service/audit_logs
      # 日誌持久化
      - opc_logs:/app/opc_service/logs
    networks:
      - evoloop_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/opc/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: evoloop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      # 日誌持久化
      - redis_logs:/var/log/redis
    networks:
      - evoloop_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  chroma:
    image: chromadb/chroma:latest
    container_name: evoloop-chroma
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
      # 日誌持久化
      - chroma_logs:/chroma/chroma/logs
    networks:
      - evoloop_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      # 新版 Chroma 映像無 curl/python，改用 bash 內建 /dev/tcp 探測 v2 心跳端點
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_data:
  redis_data:
  chroma_data:
  opc_audit_data:
  # 日誌持久化卷
  backend_logs:
  frontend_logs:
  opc_logs:
  redis_logs:
  chroma_logs:

networks:
  evoloop_net:
    driver: bridge