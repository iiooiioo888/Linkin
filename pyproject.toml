[project]
name = "linkin"
version = "0.1.0"
description = "靈境·Linkin — EvoLoop 運行時 × 世界觀 × 監控中心（自我反思閉環 AI 系統）"
requires-python = ">=3.12"
# Node 前端依赖见 frontend/package.json。
# archify（https://github.com/tt-a1i/archify）以 file:../vendor/archify 列入，
# 后端经 backend/company/archify_compile.py 调用其 CLI 产出策略图 HTML。

# ============================================================
# Ruff — Linter & Formatter
# ============================================================
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# 与当前代码基线一致的规则忽略列表
# 后续可按需逐步收紧
ignore = [
    "B008",    # flake8-bugbear：函数参数默认值中调用函数
    "C401",    # flake8-comprehensions：不必要的生成器（可改写为集合推导式）
    "DTZ003",  # flake8-datetimez：datetime.utcnow() 已弃用
    "DTZ005",  # flake8-datetimez：datetime.now() 缺少 tz 参数
    "F841",    # pyflakes：未使用变量
    "RUF059",  # ruff：解包变量未使用
    "SIM102",  # flake8-simplify：嵌套 if 可合并（测试文件中常见）
    "UP017",   # pyupgrade：datetime.UTC 别名（Python 3.12+ 风格）
    "UP041",   # pyupgrade：TimeoutError 别名
    # 運行時降級／護欄邊界：刻意廣捕 Exception 或静默 pass，避免單點故障拖垮管線
    "BLE001",  # blind-except — LLM/OPC/Docker/向量庫等可選依賴探測
    "S110",    # try-except-pass — 同上，降級路徑不刷屏
    "TRY004",  # 與既有 ValueError 契約一致（量化／archify 輸入驗證）
    "PLW0602", # stage_router 延遲初始化 singleton（global 只讀）
    "PLC0206", # quant_tools 就地更新嵌套 dict（已知模式）
    "RUF012",  # hub schema / 測試 stub 的 mutable class default
    "ASYNC230", # 測試夾具同步 open（pytest 隔離目錄）
]

# ============================================================
# Mypy — Static Type Checker
# ============================================================
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
# 默认不检查无类型注解的函数体（避免大量噪音）
check_untyped_defs = false

# 已知类型问题的模块 —— 后续按需修复后移除（已全部清零）

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# --basetemp：使用專案內暫存目錄，避免 Windows 系統暫存目錄建立失敗 (OSError)
addopts = "-v --basetemp=.pytest_tmp"
