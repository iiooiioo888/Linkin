---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: linkin
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: linkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: linkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: linkin
        linkin.io/mtls: required
        linkin.io/scale-signal: qps
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: api-gateway
          image: "linkin/scaffold/api-gateway:0.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: linkin
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: linkin
spec:
  selector:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: linkin
  ports:
    - name: http
      port: 8080
      targetPort: http
