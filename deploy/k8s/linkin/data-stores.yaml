---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: linkin
  labels:
    app.kubernetes.io/name: chroma
    app.kubernetes.io/part-of: linkin
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chroma
      app.kubernetes.io/part-of: linkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chroma
        app.kubernetes.io/part-of: linkin
        linkin.io/mtls: required
        linkin.io/scale-signal: disk
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: chroma
          image: "linkin/scaffold/chroma:0.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "10Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: linkin
  labels:
    app.kubernetes.io/name: chroma
    app.kubernetes.io/part-of: linkin
spec:
  selector:
    app.kubernetes.io/name: chroma
    app.kubernetes.io/part-of: linkin
  ports:
    - name: http
      port: 8000
      targetPort: http
---
