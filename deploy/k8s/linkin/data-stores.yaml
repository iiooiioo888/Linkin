---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: linkin
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: linkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: linkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: linkin
        linkin.io/mtls: required
        linkin.io/scale-signal: disk
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: postgres
          image: "linkin/scaffold/postgres:0.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: db
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          livenessProbe:
            tcpSocket:
              port: db
          readinessProbe:
            tcpSocket:
              port: db
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: linkin
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: linkin
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: linkin
  ports:
    - name: db
      port: 5432
      targetPort: db
---
