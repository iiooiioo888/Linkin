# G-OBS1｜path-counts 保路徑 nginx 精確 location（shadow／docs example）
# ------------------------------------------------------------
# 性質：給產線 `/etc/nginx/conf.d/linkin.conf` **參考**；**不**自動套用 live。
# 旗標：does_not_modify_nginx_live=true · wire_change=none · ready_to_merge=false
# 部署：需**另授**才改 live nginx／reload；本 PR 僅倉庫範例。
#
# 根因：通用 `location /api/ { proxy_pass http://127.0.0.1:8000/; }` 剝 `/api`，
# AuthGate `_OPEN_EXACT` 僅有 `/api/internal/modelgw/path-counts` → 401。
# 本 exact location 保留完整 path；**同時** L2 見反代頭（XFF／X-Real-IP）必須 token
# （防 peer=127.0.0.1 經反代裸洩）。勿天真只開 `_OPEN_EXACT` 剝前綴 path。
#
# 插入位置：於既有 `location /api/` **之前**（exact 優先）。
# upstream：產線用 127.0.0.1:8000；compose／frontend 映像用 backend:8000（見 frontend/nginx.conf）。
# ------------------------------------------------------------

# G-OBS1 path-counts：保留完整 /api/...，避免被下方 /api/ 剝前綴
location = /api/internal/modelgw/path-counts {
    proxy_pass http://127.0.0.1:8000/api/internal/modelgw/path-counts;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 25s;
}

# 套用後驗收（另授部署票）：
# - 經 nginx 無 token → 不得裸 200（期望 403 PATH_COUNTS_FORBIDDEN；不再 AuthGate 401）
# - 經 nginx + 正確 X-ModelGW-Internal-Token → 200（需已設 MODELGW_PATH_COUNTS_TOKEN）
# - 直連 :8000 無反代頭 loopback → 仍可 200（不變）
# - 不改全域 location /api/ 剝前綴；不啟 TLS；WIRE 維持 enforce
