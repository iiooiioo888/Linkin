# UX-001｜HTTPS＋網域 nginx example（shadow／docs）
# ------------------------------------------------------------
# 性質：範例組態；**不**啟用產線；**不**含私鑰。
# 旗標：does_not_enable_tls_on_prod=true · wire_change=none · ready_to_merge=false
# 部署：需另授；替換 YOUR_DOMAIN.example 與憑證路徑後，nginx -t && reload。
# 硬口徑：本檔不得覆蓋現網「唯一啟用 listen 80」行為，除非部署票明確授權。
# ------------------------------------------------------------

# --- HTTP：僅對目標網域 301 → HTTPS（placeholder server_name） ---
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.example;

    # ACME http-01（若採 webroot；路徑依產線調整；本 example 不掛真實目錄）
    # location ^~ /.well-known/acme-challenge/ {
    #     root /var/www/acme;
    # }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS：TLS 終止（憑證路徑為 placeholder；倉庫無私鑰） ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN.example;

    # 部署時替換為真實 PEM；禁止把私鑰提交進 git
    ssl_certificate     /etc/nginx/ssl/YOUR_DOMAIN.example.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/YOUR_DOMAIN.example.privkey.pem;

    # 建議最低；實際套件／協議依產線 OpenSSL／nginx 版本另授調整
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 可選 HSTS：僅在 HTTPS 穩定且全站可強制後另授開啟
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 以下 proxy／root 僅示意；部署時對齊現行 frontend/nginx.conf 或外層代理拓樸
    # （本 example 不宣告為產線唯一真相）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 備註：現網「唯一啟用 80」的預設 server（server_name _ 等）維持原樣；
# 本 example 以具體 server_name 並存，避免本 PR 被解讀為已改產線 80 行為。
