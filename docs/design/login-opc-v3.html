<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重構 Linkin — 登入 OPC v3（設計參考）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0d;
      --card: #111116;
      --line: #22222a;
      --line-hi: #2e2e38;
      --ink: #e8e8ec;
      --sub: #7a7a86;
      --faint: #4a4a54;
      --dim: #2a2a32;
      --accent: #c9a961;
      --accent-hi: #e0c078;
      --accent-dk: #6e5a32;
      --cyan: #5fb8c9;
      --green: #6fa87f;
      --blue: #7a92b8;
      --red: #c47a7a;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      margin: 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--card) 94%, transparent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 12%, transparent), 0 24px 64px rgba(0,0,0,.55);
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-hi) 30%, var(--accent) 50%, var(--accent-hi) 70%, transparent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent);
    }
    .status {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 18px; border-bottom: 1px solid var(--line);
      font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--faint);
    }
    .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 6px; }
    .brand { text-align: center; padding: 22px 24px 6px; }
    .brand h1 { font-size: 20px; font-weight: 600; }
    .brand h1 span { color: var(--accent); }
    .brand p { font-size: 12px; color: var(--sub); margin-top: 6px; }
    .form { padding: 16px 24px 20px; }
    label { display: block; font-size: 11px; color: var(--sub); margin: 12px 0 6px; }
    input[type=text], input[type=password] {
      width: 100%; height: 38px; padding: 8px 12px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--dim); color: var(--ink); font-size: 14px;
    }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 11px; color: var(--sub); }
    .submit {
      width: 100%; height: 40px; margin-top: 18px; border-radius: 8px; border: 1px solid var(--accent-dk);
      background: linear-gradient(180deg, var(--accent-hi), var(--accent)); color: #0a0a0d;
      font-weight: 600; letter-spacing: .06em; cursor: pointer;
    }
    .footer {
      text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--faint);
      padding-bottom: 16px;
    }
    @media (max-width: 480px) {
      .brand svg { transform: scale(.88); transform-origin: center top; }
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="card">
    <div class="status">
      <span><span class="dot"></span>Core <span style="color:var(--green)">Online</span></span>
      <span>AP-01 · 14ms</span>
    </div>
    <div class="brand">
      <!-- 分層 OPC 金字塔標誌 56×72 -->
      <svg viewBox="0 0 56 72" width="56" height="72" style="margin-bottom:14px;filter:drop-shadow(0 0 6px rgba(201,169,97,.45))">
        <line x1="28" y1="22" x2="16" y2="36" stroke="#c9a961" stroke-width="1" opacity=".55"/>
        <line x1="28" y1="22" x2="28" y2="36" stroke="#c9a961" stroke-width="1" opacity=".55"/>
        <line x1="28" y1="22" x2="40" y2="36" stroke="#c9a961" stroke-width="1" opacity=".55"/>
        <line x1="16" y1="40" x2="14" y2="54" stroke="#7a92b8" stroke-width="1" opacity=".5"/>
        <line x1="28" y1="40" x2="28" y2="58" stroke="#7a92b8" stroke-width="1" opacity=".5"/>
        <line x1="40" y1="40" x2="42" y2="54" stroke="#7a92b8" stroke-width="1" opacity=".5"/>
        <g transform="translate(28,14) rotate(45)">
          <rect x="-10" y="-10" width="20" height="20" fill="#c9a961" rx="1"/>
          <rect x="-5" y="-5" width="10" height="10" fill="#111116" rx=".5"/>
        </g>
        <polygon points="16,36 12,44 20,44" fill="#7a92b8"/>
        <polygon points="28,36 24,44 32,44" fill="#7a92b8"/>
        <polygon points="40,36 36,44 44,44" fill="#7a92b8"/>
        <circle cx="14" cy="54" r="2.5" fill="#5fb8c9"/>
        <circle cx="20" cy="54" r="2.5" fill="#5fb8c9"/>
        <circle cx="36" cy="54" r="2.5" fill="#5fb8c9"/>
        <circle cx="42" cy="54" r="2.5" fill="#5fb8c9"/>
        <circle cx="22" cy="62" r="2.5" fill="#5fb8c9"/>
        <circle cx="34" cy="62" r="2.5" fill="#5fb8c9"/>
        <g transform="translate(28,58) rotate(45)"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#c47a7a"/></g>
      </svg>
      <h1>重構 <span>Linkin</span></h1>
      <p>多角色編排控制面</p>
    </div>
    <form class="form" onsubmit="event.preventDefault()">
      <label>帳號</label>
      <input type="text" autocomplete="username" />
      <label>密碼</label>
      <input type="password" autocomplete="current-password" />
      <div class="row">
        <label><input type="checkbox" /> 記住此裝置</label>
        <a href="#" style="color:var(--faint);text-decoration:none">忘記密碼</a>
      </div>
      <button class="submit" type="submit">登入</button>
    </form>
    <div class="footer">Secure · v0.0.0 · TLS 1.3</div>
  </div>
  <script>
    /* 簡化版 OPC 角色網路背景 — 完整實作見 frontend/src/components/login/OpcNetworkBackground.tsx */
    const c = document.getElementById('bg');
    const ctx = c.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const nodes = [];
    let w, h, raf;
    function resize() {
      w = innerWidth; h = innerHeight;
      c.width = w; c.height = h;
      nodes.length = 0;
      const n = innerWidth < 640 ? 15 : 24;
      for (let i = 0; i < n; i++) {
        const tier = i % 3;
        nodes.push({
          x: Math.random() * w, y: (0.2 + tier * 0.28) * h + (Math.random() - .5) * h * .15,
          tier, r: tier === 0 ? 5 : tier === 1 ? 4 : 3
        });
      }
    }
    function draw() {
      ctx.fillStyle = '#0a0a0d'; ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i], b = nodes[(i + 1) % nodes.length];
        if (b.tier <= a.tier) continue;
        ctx.beginPath(); ctx.moveTo(a.x, a.y);
        ctx.bezierCurveTo(a.x, a.y - 40, b.x, b.y + 30, b.x, b.y);
        ctx.strokeStyle = a.tier === 0 ? '#c9a961' : '#7a92b8';
        ctx.globalAlpha = .2; ctx.stroke(); ctx.globalAlpha = 1;
      }
      nodes.forEach(n => {
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = n.tier === 0 ? '#c9a961' : n.tier === 1 ? '#7a92b8' : '#5fb8c9';
        ctx.fill();
      });
      if (!reduced) raf = requestAnimationFrame(draw);
    }
    resize(); window.addEventListener('resize', resize);
    draw();
  </script>
</body>
</html>
